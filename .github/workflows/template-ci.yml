name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [expo, nuxt, next]
    steps:
      - uses: actions/checkout@v4
      - name: Initialise variant
        run: ./scripts/init.sh ${{ matrix.variant }} starter-test --repo Nomadicode/starter-test-ui
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checks
        run: |
          case "${{ matrix.variant }}" in
            expo) pnpm typecheck && pnpm lint && pnpm test:ci && pnpm export:web ;;
            nuxt) pnpm typecheck && pnpm lint && pnpm generate ;;
            *) pnpm typecheck && pnpm lint && pnpm build ;;
          esac
      - name: Setup guide has no unresolved placeholders
        run: "! grep -nE '__[A-Z_]+__|<!-- /?variant' README.md"
