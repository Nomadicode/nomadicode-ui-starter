name: Deploy production web

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    name: Deploy static site to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Load configuration from Infisical
        # Every key in <project> › Prod › /web becomes a masked env var for the steps below.
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 56f46eef-7eb8-4559-89ab-0e7b307e819a # github-actions-deploy
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /web
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require build settings
        run: |
          for key in NUXT_PUBLIC_API_URL NUXT_PUBLIC_POSTHOG_PROJECT_TOKEN; do
            [ -n "${!key}" ] || { echo "::error::$key is empty — set it in Infisical (Prod › /web)"; exit 1; }
          done
      - run: pnpm generate
      - name: Verify the API URL is baked in
        run: grep -qr "${NUXT_PUBLIC_API_URL#https://}" .output/public/index.html
      - name: Load deploy credentials from Infisical
        # <project> › Prod › /ci, loaded only after the build: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: 56f46eef-7eb8-4559-89ab-0e7b307e819a # github-actions-deploy
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=starter-web --branch=main
